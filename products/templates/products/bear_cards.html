{% load static %}

{% for product in products %}

<div class="bear-card">

    <p>ID: {{ product.id }}</p>
    <!--<p>Name: {{ product.bear_name }}</p>
    <p>Team: {{ product.team.team_name }}</p>
    <p>Type: {{ product.product_type.name }}</p>
    <p>Description: {{ product.product_description.item_name}}</p>-->
    <div class="bearimage-layer">
        <button class="bear-card-button" data-bear-id="{{ product.id }}"
            aria-label="View details for {{ product.bear_name }}">

            <img src="{% static 'images/bears/' %}{{ product.image }}" alt="{{ product.alt_text}}"
                onerror="this.src='{% static 'images/bears/noimage.webp' %}'">
        </button>
    </div>
    {% if product.special_price %}
    <span class="offer-badge">
        🔥 Special Offer
    </span>
    {% endif %}

    {% if product.discount_percent %}
    <span class="member-badge">
        ⭐ Member Discount
    </span>
    {% endif %}


</div>

{% endfor %}
