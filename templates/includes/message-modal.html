{% load static %}
<div class="message-modal hidden">

    <div class="message-modal-header">
        <h2 class="message-title"></h2>

        <button type="button" class="message-modal-close" aria-label="Close Message Modal">
            &times;
        </button>
    </div>
    <div class="message-body">

        <div class="message-icon-container">

            <img src="{% static 'images/icons/info.png' %}" class="message-info bear-toggle hidden">
            <img src="{% static 'images/icons/info.png' %}" class="message-success bear-toggle hidden">
            <img src="{% static 'images/icons/warning.png' %}" class="message-warning bear-toggle hidden">
            <img src="{% static 'images/icons/error.png' %}" class="message-error bear-toggle hidden">
            

        </div>

        <div class="message-modal-content">

            <p class="message-modal-text"></p>

        </div>

    </div>


</div>
