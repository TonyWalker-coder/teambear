<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Test</title>
    <style>
        /*Media Queries for Responsive Design and hero loading*/
        :root {
            --mobile: 480px;
            --tablet: 768px;
            --tablet-landscape: 768px;
            --laptop: 1024px;
            --desktop: 1280px;
            --navbar-height-desktop: 60px;
            --navbar-height-mobile: 50px;
            --footer-height: 50px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 15vh;
            background: #333;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero {

            height: 75vh;
            width: 100%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;


            background-image: url("/assets/images/hero/hero-mobile.webp");
            object-fit: contain;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        .hero img {

            width: 100%;
            height: 100%;
            object-fit: contain;
            /* shows entire image */



        }

        footer {
            height: 10vh;
            background: #333;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Mobile Portrait */
        @media (max-width: 400px) {

            section{
                background-color: red;
            }
        }

        /* Mobile Landscape */
        /* Short screens: mobile landscape, foldables, small embedded browsers */
        @media (max-width: 700px) and (max-height: 400px) {

            section{
                background-color: green;
            }

            
            .hero {
                background-image: url("assets/images/hero/mobil-portrait.webp");
            }
        }

        /* Tablet Portrait */
        @media (min-width: 400px) and (min-height: 400px) {

            .hero {
                background-image: url("assets/images/hero/hero-tablet-portarait.webp");

            }

            section{
                background-color: pink;
            }

            
        }

        /* Tablet Landscape */
        @media (min-width: 801px) {
            .hero {
                background-image: url("assets/images/hero/hero-desktop.webp");

            }
        }

        /* Laptop */
        @media (min-width: 2024px) {}

        /* Desktop */
        @media (min-width: 1280px) {}


        /* Footer Styles */
        .site-footer {
            /*padding: 0.5rem 1rem;*/
            background: var(--color-background);
            font-family: var(--font-body);
            color: currentColor;
            opacity: 0.7;
            font-size: 0.8rem;
            text-align: center;
            /*border-top: 1px solid rgba(0, 0, 0, 0.1);*/
        }

        .site-footer p {
            margin: 0.25rem 0;
        }

        /* Hidden modal state */
        .modal.hidden {
            display: none;
        }
    </style>
</head>

<body>

    <header>
        Header
    </header>

    <section class="hero">
        <!--img src="assets/images/hero/hero-mobile.webp"-->
    </section>

    <footer>
        Footer
    </footer>

</body>

</html>
